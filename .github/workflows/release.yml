name: release

on:
  push:
    tags: ["v0.0.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: verify before publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore-signs the module against this workflow's identity.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls-spec
          path: .spec
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build and smoke
        env:
          AGTMLS_SPEC: ${{ github.workspace }}/.spec
        run: |
          wasm-pack build --target web --release --out-dir pkg
          node tests/smoke.test.mjs
      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CARGO=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v${CARGO}" = "${GITHUB_REF_NAME}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml ${CARGO}"
            exit 1
          }
      - name: Attest the module
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "pkg/agtmls_wasm_bg.wasm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg
          path: pkg/

  npm:
    name: Publish to npmjs
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Mints the OIDC identity npm exchanges for a short-lived publish token,
      # and is what makes `--provenance` possible at all.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: pkg/

      # Trusted publishing needs npm >= 11.5.1, and the npm bundled with a Node
      # release lags well behind. Pin the CLI explicitly rather than inferring
      # it from the Node version. package-manager-cache is off because a cached
      # npm can shadow the version OIDC needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure an npm that can do OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Name the package
        run: node scripts/prepare-package.mjs

      - name: Publish (dry run)
        if: inputs.dry_run
        working-directory: pkg
        run: npm publish --access public --dry-run

      # With a trusted publisher configured for @agtmls/wasm on npmjs.com the
      # CLI authenticates over OIDC and attaches provenance on its own.
      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        working-directory: pkg
        run: npm publish --access public --provenance

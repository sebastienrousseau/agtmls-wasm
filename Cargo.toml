[package]
name = "agtmls-wasm"
version = "0.0.5"
edition = "2024"
rust-version = "1.89.0"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for the AgtMLS engine: audit agent skills in a browser, with nothing leaving the page"
repository = "https://github.com/sebastienrousseau/agtmls-wasm"
readme = "README.md"
keywords = ["wasm", "agent", "skills", "security", "audit"]
categories = ["wasm", "development-tools"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# An exact crates.io version: reproducible, and the module you run is built
# from the agtmls-core release the specification's conformance run checked.
agtmls-core = "=0.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# build.rs converts the spec's TOML rules to JSON, so the module reads them
# with serde_json (which it carries anyway) and ships no TOML parser.
[build-dependencies]
serde_json = "1.0"
toml = "1.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Explicit wasm-opt flags. wasm-pack prefers a wasm-opt already on PATH, and a
# distribution build (homebrew binaryen, for one) can have bulk-memory disabled
# while the Rust target emits memory.copy -- which fails validation with an
# error that names the opcode rather than the missing feature. Stating the
# features here makes the build behave the same whichever wasm-opt is found.
[package.metadata.wasm-pack.profile.release]
# The features rustc enables by default for wasm32-unknown-unknown. With
# `strip = true` the module carries no target_features section, so wasm-opt
# cannot detect them and parses as MVP: a second table (reference types)
# then fails with "Only 1 table definition allowed in MVP".
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-mutable-globals",
            "--enable-reference-types", "--enable-sign-ext", "--enable-multivalue"]

# -Oz plus LTO and a single codegen unit: the size budget is 500 KB gzipped and
# the analyzer is mostly regex, which is not small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
